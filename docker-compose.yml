services:
  postgres:
    image: postgres:16-alpine
    container_name: mbamager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbamager
      POSTGRES_PASSWORD: mbamager
      POSTGRES_DB: mbamager
    ports:
      - "5432:5432"
    volumes:
      - mbamager_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbamager -d mbamager"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: mbamager-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://mbamager:mbamager@postgres:5432/mbamager
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: mbamager-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mbamager_postgres_data:
